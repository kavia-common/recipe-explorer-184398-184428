<header class="app-header" role="banner" aria-label="Application header">
  <div class="container app-header-inner">
    <a routerLink="/" class="brand" title="Go to home">
      <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#2563EB" stop-opacity=".9"/>
            <stop offset="1" stop-color="#60A5FA" stop-opacity=".7"/>
          </linearGradient>
        </defs>
        <path fill="url(#g)" d="M12 2l3 5 6 1-4 4 1 6-6-3-6 3 1-6-4-4 6-1z"/>
      </svg>
      <span>Recipe<span class="brand-accent">Explorer</span></span>
    </a>

    <div class="search">
      <input
        #q
        class="input"
        [value]="query()"
        (input)="onInput(q.value)"
        type="search"
        placeholder="Search recipes (ingredients, title)..."
        aria-label="Search recipes"
      />
      <button class="btn btn-secondary" (click)="clearSearch()" title="Clear">
        Clear
      </button>
    </div>

    <nav class="nav" aria-label="Primary navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a routerLink="/favorites" routerLinkActive="active" aria-label="View favorites">Favorites</a>
    </nav>
  </div>
</header>
